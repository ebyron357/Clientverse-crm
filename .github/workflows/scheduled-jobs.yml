name: Scheduled jobs

# Drives the authenticated cron endpoints documented in docs/RAILWAY_RUNBOOK.md.
#
# This exists so the scheduler is not an open owner task requiring a third-party
# service to be chosen and wired. It reduces that work to adding two repository
# secrets. GitHub's scheduled runs are best effort and can be delayed under load, so
# this is appropriate for the idempotent sweeps below; if a strict cadence is ever
# required, point a dedicated scheduler at the same endpoints instead and disable
# this workflow.
#
# Required repository secrets:
#   CLIENTVERSE_PRODUCTION_URL — e.g. https://clientverse-crm-production-production.up.railway.app
#   WEBHOOK_CRON_SECRET        — the same value configured on the service
#
# With either secret missing the workflow exits successfully without calling anything,
# so an unconfigured repository does not produce a wall of failing scheduled runs.

on:
  schedule:
    - cron: '*/15 * * * *'   # commitment risk
    - cron: '*/5 * * * *'    # durable work-queue worker
    - cron: '0,30 * * * *'   # integration sync + next best actions
    - cron: '5 * * * *'      # daily digest + Second Chance detection
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated cron paths to call (default: all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Call scheduled endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Select endpoints for this tick
        id: select
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOBS: ${{ github.event.inputs.jobs }}
        run: |
          if [ -n "$MANUAL_JOBS" ]; then
            echo "paths=$MANUAL_JOBS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            '*/15 * * * *')  paths='commitment-risk' ;;
            '*/5 * * * *')   paths='work-queue' ;;
            '0,30 * * * *')  paths='integration-sync,next-best-actions' ;;
            '5 * * * *')     paths='daily-digest,second-chance' ;;
            *)               paths='commitment-risk,work-queue,integration-sync,next-best-actions,daily-digest,second-chance' ;;
          esac
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Call the endpoints
        env:
          BASE_URL: ${{ secrets.CLIENTVERSE_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.WEBHOOK_CRON_SECRET }}
          PATHS: ${{ steps.select.outputs.paths }}
        run: |
          set -u
          if [ -z "${BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "CLIENTVERSE_PRODUCTION_URL or WEBHOOK_CRON_SECRET is not configured; nothing was called."
            exit 0
          fi
          base="${BASE_URL%/}"
          failures=0
          # A distinct delivery id per call keeps the endpoints' idempotency guard
          # meaningful: a retried delivery is suppressed, a new tick is not.
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IFS=','
          for path in $PATHS; do
            path="$(echo "$path" | tr -d '[:space:]')"
            [ -z "$path" ] && continue
            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "X-Webhook-Id: gha-${path}-${run_id}" \
              --max-time 30 --retry 2 --retry-delay 5 \
              "${base}/api/cron/${path}" || echo "000")
            # Never echo the response body: it is application output, not secret, but
            # keeping scheduled logs to status codes avoids accidental disclosure.
            echo "${path}: HTTP ${status}"
            if [ "$status" != "200" ]; then failures=$((failures + 1)); fi
          done
          unset IFS
          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} scheduled endpoint call(s) did not return HTTP 200"
            exit 1
          fi
