name: Role Permission Completion

on:
  push:
    branches:
      - feature/role-permission-enforcement
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: clientverse_ci
      JWT_SECRET: ci-role-permission-secret-2026
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: tvpro357@gmail.com
      ADMIN_PASSWORD: ClientVerse2026!
      WEBHOOK_CRON_SECRET: ci-webhook-cron-secret
      EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY }}
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      TEST_API_BASE: http://127.0.0.1:8001
      CI: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/role-permission-enforcement
      - name: Apply scoped implementation
        run: |
          python scripts/implement_role_permissions.py
          python scripts/role_permission_ci_adjustments.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ -r backend/requirements.txt
      - name: Start API
        run: |
          cd backend
          nohup uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/clientverse-api.log 2>&1 &
          echo $! > /tmp/clientverse-api.pid
          cd ..
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8001/api/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/clientverse-api.log
          exit 1
      - name: Targeted role and permission tests
        run: pytest -q backend/tests/test_role_permissions.py
      - name: Full backend suite diagnostic
        shell: bash
        run: |
          set +e
          pytest -q backend/tests 2>&1 | tee /tmp/full-backend.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Full backend suite passed."
            exit 0
          fi
          if [ -n "$EMERGENT_LLM_KEY" ]; then
            echo "Full backend suite failed despite configured AI provider key."
            exit "$rc"
          fi
          failed_count=$(grep -c '^FAILED ' /tmp/full-backend.log || true)
          grep -q 'FAILED backend/tests/backend_test.py::TestAI::test_ai_health_summary' /tmp/full-backend.log
          grep -q 'FAILED backend/tests/backend_test.py::TestAI::test_ai_draft' /tmp/full-backend.log
          if [ "$failed_count" -ne 2 ]; then
            echo "Unexpected backend failures beyond the two external AI-provider tests."
            exit "$rc"
          fi
          echo "Only known external AI-provider tests are blocked because EMERGENT_LLM_KEY is not configured in Actions."
      - name: Backend regression gate without external AI provider
        run: pytest -q backend/tests -k 'not test_ai_health_summary and not test_ai_draft'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Frontend production build
        run: |
          corepack enable
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build
      - name: Commit completed phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/tests/test_role_permissions.py frontend/src/App.js frontend/src/components/AppShell.jsx frontend/src/pages/Team.jsx frontend/src/pages/InviteAccept.jsx README.md
          git rm scripts/implement_role_permissions.py scripts/role_permission_ci_adjustments.py .github/workflows/role-permission-completion.yml
          git diff --cached --check
          git commit -m "feat: enforce tenant roles and permissions"
          git push origin HEAD:feature/role-permission-enforcement
