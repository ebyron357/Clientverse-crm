# Backup-and-restore drill: prove the restore procedure works, end to end, on a
# throwaway MongoDB 7 -- never production.
#
# 1. Start the real API on an empty database and create known records through it
#    (scripts/restore_drill.mjs seed): an organization with a known password, a website
#    form with a server key, a lead with its contact, deal and task, a stage move and a
#    completed task.
# 2. Back the database up with `mongodump --archive --gzip` (the procedure in the closeout
#    handoff, "Backup and restore"), stop the API and DROP the database.
# 3. Restore with `mongorestore --archive --gzip --drop`, start the API again, and check
#    every record, the password hash, the server key and the idempotency index came back
#    (scripts/restore_drill.mjs verify).
#
# This tests the procedure and tools. It does not test Atlas's own backups, which only
# the Atlas project owner can see.
name: Backup and restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'   # monthly, 06:17 UTC on the 1st
  push:
    paths:
      - '.github/workflows/backup-restore-drill.yml'
      - 'scripts/restore_drill.mjs'

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: clientverse_restore_drill
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: drill-admin@example.com
      IN_PROCESS_SCHEDULER: '0'
      LEAD_SLA_WATCHER: '0'
      CLIENTVERSE_API_BASE: http://127.0.0.1:8001
      DRILL_STATE: /tmp/drill/state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Generate ephemeral secrets
        run: |
          mkdir -p /tmp/drill
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "WEBHOOK_CRON_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)Aa1!"
            echo "INTEGRATION_ENC_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          } >> "$GITHUB_ENV"
      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/drill/api-1.log 2>&1 &
          echo $! > /tmp/drill/api.pid
          for i in $(seq 1 60); do curl -fsS "$CLIENTVERSE_API_BASE/api/health" >/dev/null && exit 0; sleep 2; done
          cat /tmp/drill/api-1.log; exit 1
      - name: Create known records
        run: node scripts/restore_drill.mjs seed
      - name: Back up (mongodump)
        run: |
          docker run --rm --network host -v /tmp/drill:/backup mongo:7 \
            mongodump --uri "$MONGO_URL" --db "$DB_NAME" --archive=/backup/backup.archive.gz --gzip
          ls -l /tmp/drill/backup.archive.gz
      - name: Stop the API and drop the database
        run: |
          kill "$(cat /tmp/drill/api.pid)"; sleep 2
          docker run --rm --network host mongo:7 \
            mongosh --quiet "$MONGO_URL/$DB_NAME" --eval 'db.dropDatabase(); print("collections left: " + db.getCollectionNames().length)'
      - name: Restore (mongorestore)
        run: |
          docker run --rm --network host -v /tmp/drill:/backup mongo:7 \
            mongorestore --uri "$MONGO_URL" --archive=/backup/backup.archive.gz --gzip --drop
      - name: Start API on the restored database
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/drill/api-2.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS "$CLIENTVERSE_API_BASE/api/health" >/dev/null && exit 0; sleep 2; done
          cat /tmp/drill/api-2.log; exit 1
      - name: Verify the restore
        run: node scripts/restore_drill.mjs verify
      - name: API logs
        if: failure()
        run: tail -n 100 /tmp/drill/api-1.log /tmp/drill/api-2.log || true
